name: Informe diario

on:
  schedule:
    # Lunes a viernes 21:30 UTC = 18:30 Chile (verano) / 17:30 (invierno), después del cierre de Nueva York.
    # GitHub puede retrasar las ejecuciones programadas entre algunos minutos y ~1 hora.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar_aviso:
        description: "Enviar un aviso de prueba aunque no haya eventos"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["engine/**", "config/**", "site/css/**", "site/js/**", "site/index.html", ".github/workflows/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar informes
        run: python engine/motor.py ${{ inputs.forzar_aviso && '--forzar-aviso' || '' }}

      - name: Aviso por correo (issue) si hay eventos nuevos
        if: hashFiles('data/aviso.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create aviso --color D03B3B --description "Avisos automáticos del portafolio" --force
          for n in $(gh issue list --label aviso --state open --json number --jq '.[].number'); do gh issue close "$n" --reason completed; done
          gh issue create --title "Aviso del portafolio · $(date -u +%d-%m-%Y)" --label aviso --body-file data/aviso.md

      - name: Guardar informe en el historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Informe $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  desplegar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
